[project]
name = "relativistic-fieldcalc"
version = "0.1.0"
description = "Bounded semantic computations for the relativistic-representation worktable"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "scipy==1.18.1",
  "sympy==1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldcalc"]
