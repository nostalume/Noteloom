[project]
name = "mathematical-physics-reduction-workbench"
version = "0.1.0"
description = "Executable certificates for bilateral group and PDE reduction"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.5,<3",
  "scipy>=1.18,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]
